        answer=d+e;
        prompt=`Tabel buku pinjaman: Senin ${d} buku, Selasa ${e} buku. Berapa jumlahnya?`;
        steps=`Jumlahkan kedua baris tabel: ${d} + ${e} = ${answer} buku.`;
        wrong=Math.abs(d-e);
      }else if(a===1){
        answer=d;
        prompt=`Diagram batang: kelas A ${d+e} siswa membawa bekal; kelas B ${e} siswa. Berapa lebih banyak di kelas A?`;
        steps=`Bandingkan dengan pengurangan: ${d+e} − ${e} = ${answer} siswa.`;
        wrong=d+2*e;
      }else if(a===2){
        answer=d;
        prompt=`Data latihan tiga hari ialah ${d-1}, ${d}, dan ${d+1} menit. Berapa rata-ratanya?`;
        steps=`Jumlah = ${(d-1)+d+(d+1)} menit. Bagi 3, sehingga rata-rata ${answer} menit.`;
        wrong=3*d;
      }else{
        answer=e;
        prompt=`Pada diagram gambar, ${d} simbol mewakili ${d*e} siswa. Berapa siswa yang diwakili satu simbol?`;
        steps=`Bagi banyak siswa dengan banyak simbol: ${d*e} ÷ ${d} = ${answer} siswa per simbol.`;
        wrong=d*e;
      }
    }
    return {prompt,answer,steps,unit,wrong};
  }

  function makeQuestion(b,t,a,v){
    const r=recipe(b,a,v),id=`v3-b${b}-t${t}-a${a}-v${v}`;
    const label=`${fmt(r.answer)}${r.unit?" "+r.unit:""}`;
    const mode=(t+a+v)%5;
    let prompt=r.prompt,steps=r.steps,type="mc",options,correct;
    if(mode===1){
      type="boolean";
      const claim=v%2===0?r.answer:r.wrong;
      prompt+=` ${PEOPLE[(v+b)%PEOPLE.length]} menyimpulkan jawabannya ${fmt(claim)}${r.unit?" "+r.unit:""}. Benar atau salah?`;
      correct=v%2===0?0:1;
      options=["Benar","Salah"];
      steps+=` Karena hasil yang benar ${label}, simpulan ${fmt(claim)}${r.unit?" "+r.unit:""} ${correct===0?"benar":"salah"}.`;
    }else if(mode===2){
      type="input";correct=r.answer;
      prompt+=` Tuliskan angka jawabannya tanpa satuan.`;
    }else{
      let values=[r.answer,r.wrong,r.answer+(Math.abs(r.answer)<10?2:Math.max(1,Math.round(Math.abs(r.answer)/10))),r.answer-(Math.abs(r.answer)<10?1:Math.max(1,Math.round(Math.abs(r.answer)/8)))];
      if(new Set(values).size!==4){
        values=[r.answer,r.answer+1,r.answer+2,r.answer+3];
      }
      if(mode===3){
        prompt=`Periksa strategi penyelesaian berikut: ${r.prompt} Hasil mana yang paling masuk akal?`;
        steps+=` Bandingkan dengan pilihan lain: hasil yang mengabaikan langkah atau satuan akan keliru.`;
      }else if(mode===4){
        prompt=`${r.prompt} Pilih hasil setelah memeriksa setiap langkah perhitungan.`;
      }
      const order=shuffle([0,1,2,3],hash(id));
      options=order.map(i=>`${fmt(values[i])}${r.unit?" "+r.unit:""}`);
      correct=order.indexOf(0);
    }
    return {id,b,t,a,type,prompt,options,correct,steps,answerLabel:type==="boolean"?options[correct]:label};
  }
  function valid(q){
    if(!q||!q.id||!q.prompt||!q.steps||q.correct===undefined||!q.answerLabel)return false;
    if(q.type==="input")return Number.isFinite(q.correct)&&!q.options;
    if(q.type==="boolean")return q.options?.length===2&&[0,1].includes(q.correct)&&q.options[q.correct]===q.answerLabel;
    return q.type==="mc"&&q.options?.length===4&&new Set(q.options).size===4&&q.options[q.correct]===q.answerLabel;
  }
  function activeTopics(b){return TOPICS[b].map((_,a)=>a).filter(a=>!store.disabledTopics.includes(`${b}-${a}`))}
  function pool(b,t){return activeTopics(b).flatMap(a=>Array.from({length:16},(_,v)=>makeQuestion(b,t,a,v)).filter(valid))}
  function pick(items,count,key,salt,used=[]){
    const history=store.history[key]||[];
    const candidates=shuffle(items.filter(q=>!used.includes(q.id)),hash(`${key}-${salt}`));
    const fresh=candidates.filter(q=>!history.includes(q.id));
    const chosen=[...fresh,...candidates.filter(q=>history.includes(q.id))].slice(0,count);
    if(chosen.length!==count)throw Error("Soal tervalidasi belum mencukupi.");
    store.history[key]=[...history,...chosen.map(q=>q.id)].slice(-Math.max(80,items.length-20));
    return chosen;
  }
  function packageFor(kind,b){
    const salt=String(Date.now())+"-"+Math.random();
    let questions=[];
    if(kind==="chapter"){
      for(let t=0;t<4;t++){
        const topics=activeTopics(b);
        if(!topics.length)throw Error("Aktifkan minimal satu submateri.");
        const chosen=[];
        for(let n=0;n<5;n++){
          const a=topics[n%topics.length];
          const source=Array.from({length:16},(_,v)=>makeQuestion(b,t,a,v)).filter(valid);
          chosen.push(...pick(source,1,`bab-${b}-${t}-${a}`,salt+n,chosen.map(q=>q.id)));
        }
        questions.push(...chosen);
      }
    }else{
      const active=NAMES.map((_,i)=>i).filter(i=>!store.disabled.includes(i)&&activeTopics(i).length);
      if(!active.length)throw Error("Aktifkan minimal satu bab dan submaterinya.");
      for(const [tier,amount] of [[0,8],[2,14],[3,8]]){
        const options=active.flatMap(i=>pool(i,tier));
        questions.push(...pick(options,amount,`ujian-${tier}`,salt+tier,questions.map(q=>q.id)));
      }
      questions=shuffle(questions,hash(salt));
    }
    if(questions.length!==(kind==="chapter"?20:30)||new Set(questions.map(q=>q.id)).size!==questions.length||!questions.every(valid))
      throw Error("Paket soal tidak lolos pemeriksaan.");
    return {kind,b,questions,answers:{},index:0,phase:"question",remedialIds:[],remedialIndex:0,remedialChecked:false,remedialCorrect:false};
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch{notice="Penyimpanan browser tidak tersedia; sesi mungkin hilang setelah halaman ditutup."}}
  function load(){
    try{
      const data=JSON.parse(localStorage.getItem(KEY)||"{}");
      store={...defaults(),...data};
      store.disabled=Array.isArray(store.disabled)?store.disabled:[];
      store.disabledTopics=Array.isArray(store.disabledTopics)?store.disabledTopics:[];
      store.history=store.history&&typeof store.history==="object"?store.history:{};
      const s=store.session;
      if(!s||!Array.isArray(s.questions)||s.questions.length!==(s.kind==="chapter"?20:30)||!s.questions.every(valid)||!["question","result","remedial"].includes(s.phase))store.session=null;
      else{
        s.answers=s.answers&&typeof s.answers==="object"?s.answers:{};
        s.index=Math.max(0,Math.min(s.questions.length-1,Number(s.index)||0));
        if(s.phase==="question"){
          const first=s.questions.findIndex(q=>!s.answers[q.id]);
          if(first>=0)s.index=first;
        }
      }
    }catch{store=defaults()}
  }
  function nav(p){page=p;selected=null;notice="";render();window.scrollTo({top:0,behavior:"smooth"})}
  function begin(kind,b){try{store.session=packageFor(kind,b);save();nav("question")}catch(e){notice=e.message;render()}}
  function current(){const s=store.session;return s?.phase==="remedial"?s.questions.find(q=>q.id===s.remedialIds[s.remedialIndex]):s?.questions[s.index]}
  function checked(s,q){return Object.prototype.hasOwnProperty.call(s.answers,q.id)}
  function count(s){return Object.values(s.answers).filter(a=>a.correct).length}
  function response(q,value){
    if(q.type==="input"){
      const normalized=String(value).trim().replace(/\s/g,"").replace(",",".");
      if(!/^-?\d+(\.\d+)?$/.test(normalized))return null;
      return Number(normalized)===q.correct;
    }
    if(value===null||value===undefined)return null;
    return Number(value)===q.correct;
  }
  function finish(){
    const s=store.session;

  app.addEventListener("click",e=>{
    const button=e.target.closest("[data-action]");if(!button)return;

    if(action==="remedial"){
      if(!s)return;
      s.remedialIds=s.questions.filter(q=>s.answers[q.id]&&!s.answers[q.id].correct).map(q=>q.id);
      s.remedialIndex=0;s.remedialChecked=false;s.remedialCorrect=false;s.phase="remedial";save();
      nav(s.remedialIds.length?"question":"remedialDone");return;
    }
    if(!s)return;
    const q=current();if(!q)return;
    if(action==="choose"){
      if(s.phase==="remedial"?s.remedialChecked:checked(s,q))return;
      selected=Number(button.dataset.value);
      app.querySelectorAll('[data-action="choose"]').forEach(el=>{
        const active=Number(el.dataset.value)===selected;
        el.classList.toggle("selected",active);el.setAttribute("aria-pressed",String(active));
      });
      document.getElementById("inline-error").textContent="";
      return;
    }
    if(action==="check"){
      if(s.phase==="remedial"?s.remedialChecked:checked(s,q))return;
      const raw=q.type==="input"?document.getElementById("numeric-answer").value:selected;
      const error=document.getElementById("inline-error");
      if(raw===null||raw===undefined||String(raw).trim()===""){
        error.textContent=q.type==="input"?"Masukkan angka yang valid terlebih dahulu.":"Pilih salah satu jawaban terlebih dahulu.";return;
      }
      const correct=response(q,raw);
      if(correct===null){error.textContent="Masukkan angka yang valid terlebih dahulu.";return}
      if(s.phase==="remedial"){s.remedialChecked=true;s.remedialCorrect=correct}
      else s.answers[q.id]={correct,answer:raw};
      selected=null;save();render();return;
    }
    if(action==="previous"){
      if(s.kind==="exam"&&s.phase==="question"&&s.index>0){s.index--;selected=null;save();render()}
      return;
    }
    if(action==="next"){
      if(s.phase==="remedial"){
        if(!s.remedialChecked)return;
        s.remedialIndex++;s.remedialChecked=false;s.remedialCorrect=false;selected=null;save();
        if(s.remedialIndex>=s.remedialIds.length)nav("remedialDone");else render();
      }else if(checked(s,q)){
        if(s.index===s.questions.length-1)finish();
        else{s.index++;selected=null;save();render()}
      }
    }
  });
  app.addEventListener("change",e=>{
    const cb=e.target;
    if(cb.dataset.toggleB!==undefined){
      const b=Number(cb.dataset.toggleB);
      store.disabled=cb.checked?store.disabled.filter(v=>v!==b):[...new Set([...store.disabled,b])];
      save();return;
    }
    if(cb.dataset.toggleTopic!==undefined){
      const key=cb.dataset.toggleTopic,b=Number(key.split("-")[0]);
      if(!cb.checked&&TOPICS[b].every((_,a)=>store.disabledTopics.includes(`${b}-${a}`)||`${b}-${a}`===key)){
        cb.checked=true;document.getElementById("settings-error").textContent="Sisakan minimal satu submateri aktif untuk setiap bab.";return;
      }
      document.getElementById("settings-error").textContent="";
      store.disabledTopics=cb.checked?store.disabledTopics.filter(v=>v!==key):[...new Set([...store.disabledTopics,key])];save();
    }
  });
  document.getElementById("logo-home").addEventListener("click",()=>nav("home"));
  document.getElementById("top-home").addEventListener("click",()=>nav("home"));
  load();render();
})();
</script>
 
</body></html>
